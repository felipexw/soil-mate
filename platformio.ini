; Upload goes through an Arduino Uno running ArduinoISP (built for 115200
; baud), wired to the Pro Mini's RST, D11, D12 and D13. upload_port is the
; Uno's port. -e is needed because PlatformIO turns off avrdude's auto-erase.
;
; Keep stk500v1 rather than "arduino": the Uno is also an ATmega328P, and with
; "arduino" its own bootloader can pass for the target and get overwritten.
;
; disable_flushing stops PlatformIO toggling DTR, which would reset the Uno.
[env:promini]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
monitor_speed = 115200
; Serial output comes from the FTDI/CP2102 adapter on the Pro Mini's TX, not the Uno.
monitor_port = /dev/cu.usbserial-0001
lib_deps =
    majicdesigns/MD_MAX72XX @ ^3.3.0
upload_protocol = stk500v1
upload_port = /dev/cu.usbserial-A5069RR4
upload_speed = 115200
upload_flags = -e
board_upload.disable_flushing = true
extra_scripts = isp_hold_port.py
